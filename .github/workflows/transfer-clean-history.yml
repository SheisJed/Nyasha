name: Transfer verified Nyasha history

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  transfer-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout verified staging commit
        uses: actions/checkout@v4
        with:
          repository: sheisjed/Nyasha-clean
          ref: 0b35b42bdb2e20355c0907a8f21de98750468a53
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact commit and history length
        env:
          EXPECTED_SHA: 0b35b42bdb2e20355c0907a8f21de98750468a53
        run: |
          actual="$(git -C source rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA" || {
            echo "Unexpected staging commit."
            exit 1
          }

          count="$(git -C source rev-list --count HEAD)"
          echo "Verified staging history: $count commits"
          test "$count" -eq 3 || {
            echo "Expected exactly 3 commits."
            exit 1
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        working-directory: source
        run: npm ci

      - name: Build portfolio
        working-directory: source
        run: npm run build

      - name: Verify sitemap and Google verification file
        working-directory: source
        run: |
          test -f dist/sitemap.xml
          cat dist/sitemap.xml
          test -f googleb136d61921318dd2.html
          cp googleb136d61921318dd2.html dist/

      - name: Upload verified website
        uses: actions/upload-pages-artifact@v3
        with:
          path: source/dist

      # DESTRUCTIVE STEP:
      # This replaces original main with the verified staging history.
      # It runs only after all preceding checks succeed.
      - name: Replace original main history
        env:
          GH_TOKEN: ${{ secrets.HISTORY_TRANSFER_TOKEN }}
          EXPECTED_SHA: 0b35b42bdb2e20355c0907a8f21de98750468a53
        run: |
          git -C source push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "${EXPECTED_SHA}:refs/heads/main"

      - name: Deploy verified portfolio
        id: deployment
        uses: actions/deploy-pages@v4
